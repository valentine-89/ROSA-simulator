<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nhà kính thông minh</title>
  <link rel="stylesheet" href="/dashboard-themes.css" />
  <script>(function(){try{var t=localStorage.getItem("sample-dashboard-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}})();</script>
  <link rel="stylesheet" href="/sample_dashboards/smart-greenhouse/dashboard.css?v=2026.07.15.1" />
</head>
<body>
  <!-- AI-BRIDGE-EDITABLE HTML LAYOUT: START -->
  <main class="gh-page" id="greenhouse-root">
    <header class="gh-hero">
      <div class="gh-brand">
        <div class="gh-logo" aria-hidden="true">♧</div>
        <div><span class="gh-eyebrow">ROSA GREENHOUSE</span><h1 id="gh-title">Nhà kính thông minh</h1><p id="gh-subtitle">Vi khí hậu, tưới tiêu và thiết bị trong một màn hình</p></div>
      </div>
      <div class="gh-hero-tools"><div class="gh-live"><i id="gh-live-dot"></i><span id="gh-live-text">Đang kết nối</span></div><div class="gh-clock" id="gh-clock">--:--:--</div></div>
    </header>
    <section class="gh-alert" id="gh-alert" hidden></section>
    <section class="gh-kpis" id="gh-kpis"></section>
    <section class="gh-main-grid">
      <article class="gh-panel gh-climate-panel">
        <div class="gh-panel-head"><div><span class="gh-section-label">VI KHÍ HẬU</span><h2>Điều kiện nhà kính</h2></div><select id="gh-history-range" aria-label="Khoảng biểu đồ"><option value="60">1 giờ</option><option value="360">6 giờ</option><option value="1440" selected>24 giờ</option><option value="10080">7 ngày</option></select></div>
        <div class="gh-climate" id="gh-climate"></div>
        <div class="gh-chart-wrap"><div class="gh-chart-legend"><span><i class="temp"></i>Nhiệt độ</span><span><i class="humidity"></i>Độ ẩm</span></div><svg class="gh-chart" viewBox="0 0 640 190" preserveAspectRatio="none" aria-label="Biểu đồ nhiệt độ và độ ẩm"><line x1="18" y1="38" x2="622" y2="38"/><line x1="18" y1="94" x2="622" y2="94"/><line x1="18" y1="150" x2="622" y2="150"/><path class="gh-chart-temp" id="gh-chart-temp"/><path class="gh-chart-humidity" id="gh-chart-humidity"/></svg></div>
      </article>
      <article class="gh-panel"><div class="gh-panel-head"><div><span class="gh-section-label">THIẾT BỊ</span><h2>Điều khiển nhanh</h2></div><span class="gh-small">Chờ telemetry xác nhận</span></div><div class="gh-device-grid" id="gh-devices"></div></article>
    </section>
    <section class="gh-toolbar"><div><span class="gh-section-label">KHU VỰC TRỒNG</span><h2>Độ ẩm đất theo luống</h2></div><p id="gh-zone-summary">Đang tải dữ liệu...</p></section>
    <section class="gh-zone-grid" id="gh-zones"></section>
  </main>
  <div class="gh-toast-stack" id="gh-toast-stack" aria-live="polite"></div>
  <div class="theme-picker" id="theme-picker"><button class="theme-picker-toggle" id="theme-picker-toggle" type="button" aria-label="Chọn màu giao diện" title="Chọn màu giao diện" aria-haspopup="true" aria-expanded="false">🎨</button><div class="theme-picker-menu" id="theme-picker-menu"><button type="button" data-theme-option="modern-flat">Modern Flat</button><button type="button" data-theme-option="aurora-ui">Aurora UI</button><button type="button" data-theme-option="glassmorphism">Glassmorphism</button><button type="button" data-theme-option="neumorphism">Neumorphism</button><button type="button" data-theme-option="bento-grid">Bento Grid</button></div></div>
  <!-- AI-BRIDGE-EDITABLE HTML LAYOUT: END -->

  <!-- AI-BRIDGE-EDITABLE DASHBOARD CONFIG: START -->
  <script type="application/json" id="smart-greenhouse-config">
  {

    "commands":{"pumpOn":"D1O1","pumpOff":"D2O1","fanOn":"D1O2","fanOff":"D2O2","mistOn":"D1O3","mistOff":"D2O3","roofOn":"D1O4","roofOff":"D2O4","growLightOn":"D1O5","growLightOff":"D2O5"},
    "zones":[
      {"name":"Luống cà chua","crop":"Cà chua bi","accent":"#22c55e","soilField":"gh_soil_a","valveField":"gh_valve_a","valveOn":"D1O6","valveOff":"D2O6"},
      {"name":"Luống rau lá","crop":"Xà lách thủy canh","accent":"#14b8a6","soilField":"gh_soil_b","valveField":"gh_valve_b","valveOn":"D1O7","valveOff":"D2O7"},
      {"name":"Luống dưa lưới","crop":"Dưa lưới","accent":"#f59e0b","soilField":"gh_soil_c","valveField":"gh_valve_c","valveOn":"D1O8","valveOff":"D2O8"}
