<!doctype html>
<html lang="vi" data-theme="modern-flat">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Media Only · Quản lý màn hình</title>
  <link rel="stylesheet" href="/sample_dashboards/dashboard-themes.css">
  <link rel="stylesheet" href="/sample_dashboards/media-manager/media.css?v=20261102">
</head>
<body>
<!-- AI-BRIDGE-EDITABLE HTML LAYOUT: START -->
<main id="media-manager">
  <header><h1 id="title">Quản lý màn hình</h1></header>
  <p id="status" role="status" aria-live="polite">Đang tải danh sách…</p>
  <section><div class="section-heading"><h2>Màn hình <span id="count">0</span></h2><div class="actions"><button id="refresh" type="button">Làm mới</button><button id="add" class="primary" type="button">Thêm màn hình</button></div></div><div id="screens" class="screen-grid"></div></section>
</main>
<dialog id="screen-dialog"><div class="section-heading"><h2 id="form-title">Thêm màn hình</h2><button id="cancel" type="button" aria-label="Đóng">×</button></div>
    <form id="screen-form"><div class="form-grid">
      <label>Tên màn hình<input id="name" required maxlength="100" placeholder="Cửa trước"></label>
      <label>Prefix<input id="prefix" maxlength="48" pattern="[A-Za-z0-9_-]*" placeholder="frontdoor"><small id="field-preview">media</small></label>
      <label class="full">Nội dung chờ<input id="default-signal" maxlength="2000" value="text@ani1:Chào mừng"></label>
      <label class="check"><input id="enabled" type="checkbox" checked> Bật màn hình</label>
      <details class="full"><summary>Macro</summary><label>Macro được phép hiển thị<input id="macros" placeholder="macro_a, macro_b"></label></details>
    </div><p id="form-status" role="status" hidden></p><div class="actions"><button class="primary" id="save" type="submit">Tạo màn hình</button></div></form>
</dialog>
<dialog id="delete-dialog"><form method="dialog"><h2>Xóa màn hình?</h2><p id="delete-message"></p><div class="actions"><button value="cancel">Giữ lại</button><button id="delete-confirm" class="danger" value="delete">Xóa cặp trang</button></div></form></dialog>
<!-- AI-BRIDGE-EDITABLE HTML LAYOUT: END -->
<!-- AI-BRIDGE-EDITABLE DASHBOARD CONFIG: START -->
<script id="media-manager-config" type="application/json">{"title":"Quản lý màn hình","sessionId":"<<sessionid>>","syncId":"<<syncid>>","managerId":""}</script>

<script src="/sample_dashboards/media-manager/manager.js?v=20261102"></script>
<!-- AI-BRIDGE-LOCKED RUNTIME SCRIPT: END -->
</body></html>
