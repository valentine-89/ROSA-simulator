<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cài đặt kho AI</title><link rel="stylesheet" href="/sample_dashboards/setup_shared.css"></head><body><main class="shell"><header class="head"><h1>Cài đặt kho AI</h1></header><section class="panel"><div class="grid"><label class="full">Tên kho<input id="title"></label><label>Device key lưu SQLite<input id="databaseSessionId"></label><label>AccountID tính phí<input id="syncId"></label></div></section></main><script src="/sample_dashboards/setup_bridge.js"></script><script>
(function(){const ids=['title','databaseSessionId','syncId'];const defaults={title:'Quản lý kho',databaseSessionId:'<<sessionid>>',syncId:'<<syncid>>'};function apply(config){const c=Object.assign({},defaults,config);if(c.title==='Kho AI cơ bản')c.title=defaults.title;ids.forEach(id=>document.getElementById(id).value=c[id]);window.DashboardSetupBridge.resize();}window.DashboardSetupBridge.start({onInit:p=>apply(p.config),onCollect:()=>Object.fromEntries(ids.map(id=>[id,document.getElementById(id).value.trim()||defaults[id]]))});apply({});})();
</script></body></html>
