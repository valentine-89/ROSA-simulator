<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kho thử nghiệm Backend</title><style>body{font:15px system-ui;max-width:760px;margin:30px auto;padding:16px;color:#172033}button,input{font:inherit;padding:8px;border:1px solid #cbd5e1;border-radius:6px}button{background:#1d4ed8;color:white;cursor:pointer}pre{background:#f1f5f9;padding:16px;border-radius:8px;white-space:pre-wrap}#message{min-height:24px}</style></head><body>
<h1>Kho thử nghiệm</h1><p>Tra tồn kho bằng backend lưu trong SQLite. Trang gọi theo tên, không chứa API key hoặc SyncID.</p>
<form id="form"><label>Mã hàng <input id="sku" value="SP001" required></label> <button>Tìm tồn kho</button></form>
<p id="message" role="status"></p><pre id="result">Chưa chạy.</pre>
<script>document.getElementById('form').onsubmit=async function(event){event.preventDefault();var button=this.querySelector('button');button.disabled=true;document.getElementById('message').textContent='Đang chạy…';try{var result=await rosa.backend.run('kiem-tra-ton-kho',{sku:document.getElementById('sku').value});document.getElementById('result').textContent=JSON.stringify(result,null,2);document.getElementById('message').textContent='Hoàn tất.';}catch(error){document.getElementById('message').textContent=error.message;}finally{button.disabled=false;}};</script></body></html>
