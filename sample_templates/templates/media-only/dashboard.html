<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media Only</title>
  <style>
    :root {
      color-scheme: light dark;
      --stage-fg: #f7f7f6;
      --stage-subtle: rgba(247, 247, 246, 0.74);
      --stage-overlay: rgba(0, 0, 0, 0.18);
      --stage-bg: #050505;
      --stage-accent: #8ab4ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "Segoe UI Variable Text", "Segoe UI", Tahoma, Geneva, Verdana, Arial, sans-serif;
    }

    body {
      position: relative;
      color: var(--stage-fg);
      background: var(--stage-bg);
    }

    .app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      isolation: isolate;
      background: var(--stage-bg);
      color: var(--stage-fg);
    }

    .stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.08), transparent 28%),
        linear-gradient(180deg, rgba(255,255,255,0.04), transparent 24%),
        var(--stage-bg);
    }

    .backdrop,
    .backdrop::before,
    .backdrop::after {
      position: absolute;
      inset: 0;
      pointer-events: none;
      content: "";
    }

    .backdrop {
      overflow: hidden;
      background: var(--stage-bg);
    }

    .fx-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .fx-canvas {
      display: block;
      width: 100%;
      height: 100%;
      opacity: 0.96;
    }

    .style-black {
      --stage-bg: #020202;
      --stage-fg: #f9fafb;
      --stage-subtle: rgba(249, 250, 251, 0.74);
      --stage-overlay: rgba(0, 0, 0, 0.18);
      --stage-accent: #7dd3fc;
    }

    .style-white {
      --stage-bg: #f7f7f2;
      --stage-fg: #111827;
      --stage-subtle: rgba(17, 24, 39, 0.68);
      --stage-overlay: rgba(255, 255, 255, 0.2);
      --stage-accent: #2563eb;
    }

    .style-warm {
      --stage-bg: linear-gradient(145deg, #41170d 0%, #7a2a18 34%, #cc6132 100%);
      --stage-fg: #fff7ed;
      --stage-subtle: rgba(255, 247, 237, 0.78);
      --stage-overlay: rgba(53, 18, 8, 0.16);
      --stage-accent: #fed7aa;
    }

    .style-sunrise {
      --stage-bg: linear-gradient(160deg, #30155b 0%, #8d4ec2 38%, #ff8a5b 100%);
      --stage-fg: #fff8f0;
      --stage-subtle: rgba(255, 248, 240, 0.76);
      --stage-overlay: rgba(48, 21, 91, 0.18);
      --stage-accent: #fde68a;
    }

    .style-tech {
      --stage-bg:
        radial-gradient(circle at top, rgba(24, 161, 255, 0.22), transparent 34%),
        linear-gradient(180deg, #03121f 0%, #071a2b 45%, #020914 100%);
      --stage-fg: #e0f2fe;
      --stage-subtle: rgba(224, 242, 254, 0.76);
      --stage-overlay: rgba(2, 12, 24, 0.18);
      --stage-accent: #38bdf8;
    }

    .style-spotlight {
      --stage-bg:
        radial-gradient(circle at 50% 16%, rgba(255, 248, 220, 0.24), transparent 18%),
        linear-gradient(180deg, #111827 0%, #090b12 100%);
      --stage-fg: #f8fafc;
      --stage-subtle: rgba(248, 250, 252, 0.74);
      --stage-overlay: rgba(7, 9, 15, 0.18);
      --stage-accent: #fde68a;
    }

    .style-tech .backdrop::before {
      background-image:
        linear-gradient(rgba(56, 189, 248, 0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.1) 1px, transparent 1px);
      background-size: 56px 56px;
      opacity: 0.5;
    }

    .style-spotlight .backdrop::before {
      background:
        radial-gradient(circle at 50% 16%, rgba(255, 243, 199, 0.35), transparent 14%),
        linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.04) 42%, transparent 100%);
    }

    .content-layer {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 3vw, 36px);
    }

    .media-box {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .media-box img,
    .media-box video,
    .media-box iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      object-fit: contain;
      border-radius: 0;
      background: transparent;
    }

    .media-box iframe.web-frame {
      background: rgba(255,255,255,0.04);
    }

    .text-box {
      width: min(94vw, 1500px);
      max-width: 94vw;
      max-height: calc(100vh - 72px);
      text-align: center;
      line-height: 1.06;
      font-weight: 900;
      white-space: pre-wrap;
      word-break: break-word;
      letter-spacing: -0.045em;
      color: var(--stage-fg);
      text-wrap: balance;
      text-shadow:
        0 12px 34px rgba(0, 0, 0, 0.34),
        0 0 24px rgba(255, 255, 255, 0.12);
    }

    .audio-box {
      width: min(92vw, 720px);
      display: grid;
      gap: 24px;
      justify-items: center;
      text-align: center;
      color: var(--stage-fg);
    }

    .audio-visualizer {
      width: min(72vw, 420px);
      height: min(22vh, 140px);
      display: grid;
      grid-template-columns: repeat(16, minmax(0, 1fr));
      gap: 8px;
      align-items: end;
    }

    .audio-visualizer span {
      display: block;
      border-radius: 999px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--stage-accent) 84%, white 16%), color-mix(in srgb, var(--stage-accent) 65%, transparent));
      animation: equalizer 1.2s ease-in-out infinite;
      transform-origin: bottom center;
    }

    .audio-visualizer span:nth-child(odd) { animation-duration: 1s; }
    .audio-visualizer span:nth-child(3n) { animation-duration: 1.5s; }

    .audio-caption {
      max-width: 820px;
      color: var(--stage-subtle);
      font-size: clamp(0.95rem, 2vw, 1.15rem);
      line-height: 1.5;
    }

    .data-box {
      width: min(96vw, 1400px);
      height: min(88vh, 980px);
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 18px;
      padding: clamp(14px, 2.2vw, 24px);
      border-radius: 28px;
      background: color-mix(in srgb, var(--stage-overlay) 72%, rgba(0, 0, 0, 0.18));
      border: 1px solid color-mix(in srgb, var(--stage-fg) 14%, transparent);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      overflow: hidden;
    }

    .data-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      min-width: 0;
    }

    .data-title {
      margin: 0;
      min-width: 0;
      font-size: clamp(1.1rem, 2.5vw, 1.8rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--stage-fg);
    }

    .data-subtitle {
      color: var(--stage-subtle);
      font-size: clamp(0.78rem, 1.6vw, 0.95rem);
      font-weight: 600;
      white-space: nowrap;
    }

    .data-table-shell {
      min-height: 0;
      overflow: auto;
      border-radius: 22px;
      background: color-mix(in srgb, var(--stage-overlay) 62%, rgba(255, 255, 255, 0.02));
      border: 1px solid color-mix(in srgb, var(--stage-fg) 10%, transparent);
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      color: var(--stage-fg);
      font-size: clamp(0.78rem, 1.5vw, 0.98rem);
    }

    .data-table thead th {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 14px 16px;
      text-align: left;
      font-size: 0.78em;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--stage-subtle);
      background: color-mix(in srgb, var(--stage-bg) 46%, rgba(0, 0, 0, 0.28));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .data-table tbody td {
      padding: 14px 16px;
      border-top: 1px solid color-mix(in srgb, var(--stage-fg) 8%, transparent);
      vertical-align: top;
      line-height: 1.45;
    }

    .data-table tbody tr:nth-child(even) td {
      background: color-mix(in srgb, var(--stage-fg) 3%, transparent);
    }

    .data-empty {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      text-align: center;
      color: var(--stage-subtle);
      font-size: clamp(0.95rem, 1.8vw, 1.1rem);
      line-height: 1.6;
    }

    @keyframes equalizer {
      0%, 100% { transform: scaleY(0.28); opacity: 0.42; }
      50% { transform: scaleY(1); opacity: 1; }
    }

    .floating-ui {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 5;
      display: flex;
      align-items: center;
    }

    .signal-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(10, 14, 24, 0.48);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
      color: #f8fafc;
      font-size: 0.84rem;
      font-weight: 700;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: opacity 0.24s ease, transform 0.24s ease;
    }

    .signal-pill::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #f59e0b;
      box-shadow: 0 0 0 5px rgba(245, 158, 11, 0.18);
    }

    .signal-pill.is-hidden {
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
    }

    .signal-pill.is-connected::before {
      background: #22c55e;
      box-shadow: 0 0 0 5px rgba(34, 197, 94, 0.18);
    }

    @media (max-width: 720px) {
      .floating-ui {
        top: 12px;
        right: 12px;
      }

      .signal-pill {
        font-size: 0.76rem;
        padding: 8px 12px;
      }
    }
  </style>

  <script>
      (function () {
        var searchParams = new URLSearchParams(window.location.search);
        var configNode = document.getElementById("ai-bridge-media-only-config");
        var config = {};
        try {
          config = JSON.parse(configNode && configNode.textContent ? configNode.textContent : "{}");
        } catch (error) {
          config = {};
        }
        var SESSION_ID = String(searchParams.get("sessionId") || searchParams.get("sessionid") || config.sessionId || "<<sessionid>>").trim();
        var SYNC_ID = String(searchParams.get("syncId") || searchParams.get("syncid") || config.syncId || "<<syncid>>").trim();
        var publicContext = null;
        var publicMetaNode = document.getElementById("media-page-meta");
        if (publicMetaNode) {
          try {
            var publicMeta = JSON.parse(publicMetaNode.textContent);
            publicContext = JSON.parse(document.getElementById("media-page-context").textContent);
            config = publicMeta.mediaScreen;
          } catch (error) { return; }
        }
        var PUBLIC_PAGE_BASE = publicContext ? encodeURIComponent(publicContext.ioid) + "/" + encodeURIComponent(publicContext.pageId) : "";
        var MEDIA_PREFIX = String(config.prefix || "").trim();
        var MEDIA_FIELD = (MEDIA_PREFIX ? MEDIA_PREFIX + "_" : "") + (String(config.field || "media").trim() || "media");
        var STREAM_FIELDS = [MEDIA_FIELD];
        var DEFAULT_MEDIA_SIGNAL = String(config.defaultSignal || "text@ani1:Waiting for media").trim() || "text@ani1:Waiting for media";
        var STREAM_HISTORY_MS = config.historyMs == null ? 86400000 : Math.max(0, Number(config.historyMs) || 0);

      var stage = document.getElementById("stage");
      var fxLayer = document.getElementById("fx-layer");
      var contentLayer = document.getElementById("content-layer");
      var signalPill = document.getElementById("signal-pill");
      var currentDisposable = null;
      var currentFxDisposable = null;
      var currentTextNode = null;
      var resizeRaf = 0;
      var eventSource = null;
      var currentRenderToken = 0;
      var fitBurstTimers = [];
      var stageResizeObserver = null;
      var connectionState = "connecting";
      var connectionHideTimer = 0;

      var styleRegistry = {
        black: true,
        white: true,
        warm: true,
        sunrise: true,
        tech: true,
        spotlight: true,
        ani1: true,
        ani2: true,
        ani3: true,
        ani4: true,
        ani5: true,
        ani6: true,
        ani7: true,
        ani8: true,
        ani9: true,
        ani10: true
      };

      function cleanupCurrentMedia() {
        if (currentDisposable && typeof currentDisposable === "function") {
          currentDisposable();
        }
        if (currentFxDisposable && typeof currentFxDisposable === "function") {
          currentFxDisposable();
        }
        currentDisposable = null;
        currentFxDisposable = null;
        currentTextNode = null;
        while (fitBurstTimers.length) {
          clearTimeout(fitBurstTimers.pop());
        }
        contentLayer.innerHTML = "";
        if (fxLayer) {
          fxLayer.innerHTML = "";
        }
      }

      function parseMediaSignal(raw) {
        var source = String(raw == null ? "" : raw).trim();
        if (!source) {
          return {
            type: "text",
            style: "black",
            payload: "No media payload"
          };
        }

        var separatorIndex = source.indexOf(":");
        if (separatorIndex < 0) {
          return {
            type: "text",
            style: "black",
            payload: source
          };
        }

        var header = source.slice(0, separatorIndex).trim();
        var payload = source.slice(separatorIndex + 1);
        var headerParts = header.split("@");
        var type = String(headerParts[0] || "text").trim().toLowerCase();
        var style = String(headerParts[1] || "black").trim().toLowerCase();

        if (!styleRegistry[style]) {
          style = "black";
        }

        return {
          type: type || "text",
          style: style,
          payload: payload
        };
      }

      function applyStyle(styleName) {
        Object.keys(styleRegistry).forEach(function (name) {
          stage.classList.remove("style-" + name);
        });
        stage.classList.add("style-" + (styleRegistry[styleName] ? styleName : "black"));
      }

      function renderStyleEffects(styleName, mediaType) {
        if (currentFxDisposable) currentFxDisposable();
        currentFxDisposable = null;
        if (fxLayer) fxLayer.innerHTML = "";
        if (/^ani(?:[1-9]|10)$/.test(styleName)) {
          currentFxDisposable = window.MediaOnlyEffects.mount(fxLayer, styleName, {
            static: /^(video|youtube|web)$/.test(mediaType)
          });
        }
      }

      function normalizeYouTubeUrl(input) {
        var value = String(input || "").trim();
        if (!value) return "";
        try {
          var url = new URL(value);
          if (url.hostname.indexOf("youtu.be") >= 0) {
            return "https://www.youtube.com/embed/" + url.pathname.replace(/^\//, "") + "?autoplay=1&mute=1&playsinline=1&rel=0";
          }
          if (url.hostname.indexOf("youtube.com") >= 0) {
            var videoId = url.searchParams.get("v");
            if (videoId) {
              return "https://www.youtube.com/embed/" + videoId + "?autoplay=1&mute=1&playsinline=1&rel=0";
            }
            if (url.pathname.indexOf("/embed/") >= 0) {
              return value;
            }
          }
        } catch (error) {}
        return value;
      }

      function humanizeMacroName(value) {
        return String(value || "")
          .trim()
          .replace(/[_-]+/g, " ")
          .replace(/\s+/g, " ")
          .replace(/\b\w/g, function (match) { return match.toUpperCase(); });
      }

      function formatTableValue(value) {
        if (value === null || typeof value === "undefined") {
          return "—";
        }
        if (typeof value === "object") {
          try {
            return JSON.stringify(value);
          } catch (error) {
            return String(value);
          }
        }
        return String(value);
      }

      function fitText() {
        if (!currentTextNode) return;
        var node = currentTextNode;
        var min = 10;
        var max = 80;
        var bounds = contentLayer ? contentLayer.getBoundingClientRect() : { width: window.innerWidth, height: window.innerHeight };
        var spacing = window.getComputedStyle(contentLayer);
        var availableWidth = Math.min(Math.max(120, bounds.width - parseFloat(spacing.paddingLeft) - parseFloat(spacing.paddingRight) - 12), 1500);
        var availableHeight = Math.max(80, bounds.height - parseFloat(spacing.paddingTop) - parseFloat(spacing.paddingBottom) - 12);
        node.style.width = availableWidth + "px";
        node.style.maxWidth = availableWidth + "px";
        node.style.maxHeight = availableHeight + "px";
        var probe = document.createElement("div");
        probe.className = "text-box";
        probe.textContent = node.textContent || "";
        probe.style.position = "absolute";
        probe.style.left = "-99999px";
        probe.style.top = "0";
        probe.style.visibility = "hidden";
        probe.style.pointerEvents = "none";
        probe.style.width = availableWidth + "px";
        probe.style.maxWidth = availableWidth + "px";
        probe.style.maxHeight = "none";
        probe.style.overflow = "visible";
        contentLayer.appendChild(probe);

        var low = min;
        var high = max;
        var best = min;
        while (low <= high) {
          var mid = Math.floor((low + high) / 2);
          probe.style.fontSize = mid + "px";
          if (probe.scrollHeight <= availableHeight && probe.scrollWidth <= availableWidth) {
            best = mid;
            low = mid + 1;
          } else {
            high = mid - 1;
          }
        }

        contentLayer.removeChild(probe);
        node.style.fontSize = best + "px";
      }

      function requestFitText() {
        if (resizeRaf) cancelAnimationFrame(resizeRaf);
        resizeRaf = requestAnimationFrame(fitText);
      }

      function scheduleFitBurst() {
        while (fitBurstTimers.length) {
          clearTimeout(fitBurstTimers.pop());
        }
        [0, 80, 180, 360, 720].forEach(function (delay) {
          fitBurstTimers.push(window.setTimeout(requestFitText, delay));
        });
      }

      function renderText(payload) {
        var box = document.createElement("div");
        box.className = "media-box";
        var text = document.createElement("div");
        text.className = "text-box";
        text.textContent = String(payload || "").replace(/\\n/g, "\n");
        box.appendChild(text);
        contentLayer.appendChild(box);
        currentTextNode = text;
        scheduleFitBurst();
      }

      function renderImage(url) {
        var box = document.createElement("div");
        box.className = "media-box";
        var image = document.createElement("img");
        image.alt = "media image";
        image.src = String(url || "").trim();
        box.appendChild(image);
        contentLayer.appendChild(box);
      }

      function renderVideo(url) {
        var box = document.createElement("div");
        box.className = "media-box";
        var video = document.createElement("video");
        video.src = String(url || "").trim();
        video.autoplay = true;
        video.muted = true;
        video.loop = true;
        video.playsInline = true;
        video.controls = true;
        box.appendChild(video);
        contentLayer.appendChild(box);
      }

      function renderWebsite(url, className) {
        var box = document.createElement("div");
        box.className = "media-box";
        var frame = document.createElement("iframe");
        frame.className = className || "web-frame";
        frame.src = String(url || "").trim();
        frame.referrerPolicy = "no-referrer-when-downgrade";
        box.appendChild(frame);
        contentLayer.appendChild(box);
      }

      function renderAudio(url) {
        var box = document.createElement("div");
        box.className = "audio-box";

        var bars = document.createElement("div");
        bars.className = "audio-visualizer";
        for (var index = 0; index < 16; index += 1) {
          var bar = document.createElement("span");
          bar.style.height = (30 + ((index * 9) % 70)) + "%";
          bars.appendChild(bar);
        }

        var caption = document.createElement("div");
        caption.className = "audio-caption";
        caption.textContent = String(url || "").trim();

        var audio = document.createElement("audio");
        audio.src = String(url || "").trim();
        audio.controls = true;
        audio.autoplay = true;
        audio.style.width = "min(88vw, 560px)";

        box.appendChild(bars);
        box.appendChild(audio);
        box.appendChild(caption);
        contentLayer.appendChild(box);

        currentDisposable = function () {
          try {
            audio.pause();
            audio.src = "";
          } catch (error) {}
        };
      }

      function renderDataTable(macroName, renderToken) {
        var box = document.createElement("div");
        box.className = "data-box";

        var header = document.createElement("div");
        header.className = "data-header";

        var title = document.createElement("h2");
        title.className = "data-title";
        title.textContent = humanizeMacroName(macroName || "Data");

        var subtitle = document.createElement("div");
        subtitle.className = "data-subtitle";
        subtitle.textContent = "Loading data...";

        header.appendChild(title);
        header.appendChild(subtitle);

        var tableShell = document.createElement("div");
        tableShell.className = "data-table-shell";

        var empty = document.createElement("div");
        empty.className = "data-empty";
        empty.textContent = "Loading data...";
        tableShell.appendChild(empty);

        box.appendChild(header);
        box.appendChild(tableShell);
        contentLayer.appendChild(box);

        if ((!PUBLIC_PAGE_BASE && (!SESSION_ID || !SYNC_ID)) || typeof fetch !== "function" || window.location.protocol === "file:") {
          subtitle.textContent = "Unavailable";
          empty.textContent = "IoData is only available when this sample is opened through the app with sessionId and syncId.";
          return;
        }

        var controller = typeof AbortController === "function" ? new AbortController() : null;
        currentDisposable = function () {
          if (controller) {
            try {
              controller.abort();
            } catch (error) {}
          }
        };

        fetch(PUBLIC_PAGE_BASE ? "/api/iot-page-macro/" + PUBLIC_PAGE_BASE : "/api/" + encodeURIComponent(SESSION_ID) + "/" + encodeURIComponent(SYNC_ID) + "/data", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          cache: "no-store",
          body: JSON.stringify({ macro: String(macroName || "").trim() }),
          signal: controller ? controller.signal : undefined
        })
          .then(function (response) {
            if (!response.ok) {
              return response.json().catch(function () { return {}; }).then(function (errorPayload) {
                throw new Error(String(errorPayload && (errorPayload.error || errorPayload.message) || "Unable to load data."));
              });
            }
            return response.json();
          })
          .then(function (rows) {
            if (renderToken !== currentRenderToken) {
              return;
            }
            var safeRows = Array.isArray(rows) ? rows : (rows && Array.isArray(rows.rows) ? rows.rows : []);
            subtitle.textContent = safeRows.length ? (safeRows.length + " row" + (safeRows.length === 1 ? "" : "s")) : "No rows";
            tableShell.innerHTML = "";

            if (!safeRows.length) {
              var noRows = document.createElement("div");
              noRows.className = "data-empty";
              noRows.textContent = "This macro returned no rows.";
              tableShell.appendChild(noRows);
              return;
            }

            var columns = Object.keys(safeRows.reduce(function (acc, row) {
              if (row && typeof row === "object" && !Array.isArray(row)) {
                Object.keys(row).forEach(function (key) {
                  acc[key] = true;
                });
              }
              return acc;
            }, {}));

            var table = document.createElement("table");
            table.className = "data-table";
            var thead = document.createElement("thead");
            var headRow = document.createElement("tr");
            columns.forEach(function (column) {
              var th = document.createElement("th");
              th.textContent = humanizeMacroName(column);
              headRow.appendChild(th);
            });
            thead.appendChild(headRow);

            var tbody = document.createElement("tbody");
            safeRows.forEach(function (row) {
              var tr = document.createElement("tr");
              columns.forEach(function (column) {
                var td = document.createElement("td");
                td.textContent = formatTableValue(row && typeof row === "object" ? row[column] : "");
                tr.appendChild(td);
              });
              tbody.appendChild(tr);
            });

            table.appendChild(thead);
            table.appendChild(tbody);
            tableShell.appendChild(table);
          })
          .catch(function (error) {
            if (controller && controller.signal && controller.signal.aborted) {
              return;
            }
            if (renderToken !== currentRenderToken) {
              return;
            }
            subtitle.textContent = "Error";
            tableShell.innerHTML = "";
            var errorBox = document.createElement("div");
            errorBox.className = "data-empty";
            errorBox.textContent = String((error && error.message) || "Unable to load data.");
            tableShell.appendChild(errorBox);
          });
      }

      function renderMedia(parsed) {
        cleanupCurrentMedia();
        currentRenderToken += 1;
        var renderToken = currentRenderToken;
        applyStyle(parsed.style);
        renderStyleEffects(parsed.style, parsed.type);

        if (parsed.type === "image") {
          renderImage(parsed.payload);
          return;
        }

        if (parsed.type === "web") {
          renderWebsite(parsed.payload, "web-frame");
          return;
        }

        if (parsed.type === "video") {
          renderVideo(parsed.payload);
          return;
        }

        if (parsed.type === "youtube") {
          renderWebsite(normalizeYouTubeUrl(parsed.payload), "web-frame");
          return;
        }

        if (parsed.type === "audio") {
          renderAudio(parsed.payload);
          return;
        }

        if (parsed.type === "data") {
          renderDataTable(parsed.payload, renderToken);
          return;
        }

        renderText(parsed.payload);
      }

      var currentPlaybackSignal = null;
      function applyMediaSignal(value) {
        var parsed = parseMediaSignal(value);
        var playbackSignal = parsed.type !== "data"
          ? JSON.stringify([parsed.type, parsed.style, parsed.payload]) : null;
        // SSE snapshots can repeat the current value. Keep the player and its
        // playback position and animation phase until the content changes.
        if (playbackSignal !== null && playbackSignal === currentPlaybackSignal) return;
        renderMedia(parsed);
        currentPlaybackSignal = playbackSignal;
      }

      function setConnectionState(mode) {
        if (!signalPill) return;
        connectionState = mode;
        if (connectionHideTimer) {
          clearTimeout(connectionHideTimer);
          connectionHideTimer = 0;
        }
        if (mode === "hidden") {
          signalPill.classList.add("is-hidden");
          signalPill.classList.remove("is-connected");
          return;
        }
        signalPill.classList.remove("is-hidden");
        signalPill.classList.toggle("is-connected", mode === "connected");
        signalPill.textContent = mode === "connected" ? "Connected" : "Connecting...";
      }

      function handleStreamPayload(data) {
        if (!data || !data.type) return;
        if (data.type === "telemetry" && data.payload && typeof data.payload === "object") {
          if (Object.prototype.hasOwnProperty.call(data.payload, MEDIA_FIELD)) {
            applyMediaSignal(data.payload[MEDIA_FIELD]);
          }
          return;
        }
        if (data.type === "timeseries" && Array.isArray(data.rows)) {
          data.rows.forEach(function (row) {
            if (String(row.field || "").trim().toLowerCase() === MEDIA_FIELD.toLowerCase()) {
              applyMediaSignal(row.value);
            }
          });
        }
      }

      function fetchLatestMedia() {
        if ((!PUBLIC_PAGE_BASE && (!SESSION_ID || !SYNC_ID)) || typeof fetch !== "function") {
          return Promise.resolve(false);
        }
        if (window.location.protocol === "file:") {
          return Promise.resolve(false);
        }
        var latestUrl = PUBLIC_PAGE_BASE ? "/api/iot-page-telemetry/" + PUBLIC_PAGE_BASE : "/api/" + encodeURIComponent(SESSION_ID) + "/" + encodeURIComponent(SYNC_ID) + "/iotelemetry?fields=" + encodeURIComponent(MEDIA_FIELD);
        return fetch(latestUrl, { cache: "no-store" })
          .then(function (response) {
            if (!response.ok) {
              return null;
            }
            return response.json();
          })
          .then(function (result) {
            var payload = result && result.c2 && result.c2.payload;
            if (payload && Object.prototype.hasOwnProperty.call(payload, MEDIA_FIELD)) {
              applyMediaSignal(payload[MEDIA_FIELD]);
              return true;
            }
            return false;
          })
          .catch(function () {
            return false;
          });
      }

      function connectStream() {
        if (typeof EventSource === "undefined" || (!PUBLIC_PAGE_BASE && !SESSION_ID)) return;
        if (eventSource && typeof eventSource.close === "function") eventSource.close();
        setConnectionState("connecting");
        var params = new URLSearchParams();
        params.set("historyMs", String(STREAM_HISTORY_MS));
        if (!PUBLIC_PAGE_BASE && !/^IO/.test(SESSION_ID)) params.set("syncId", SYNC_ID);
        if (!PUBLIC_PAGE_BASE) params.set("fields", STREAM_FIELDS.join(","));
        eventSource = new EventSource((PUBLIC_PAGE_BASE ? "/api/iot-page-realtime/" + PUBLIC_PAGE_BASE : "/api/" + encodeURIComponent(SESSION_ID) + "/stream") + "?" + params.toString());
        eventSource.onmessage = function (event) {
          try {
            var parsed = JSON.parse(event.data);
            handleStreamPayload(parsed);
            if (parsed && parsed.type !== "heartbeat" && connectionState === "connecting") {
              setConnectionState("connected");
              connectionHideTimer = window.setTimeout(function () {
                setConnectionState("hidden");
              }, 900);
            }
          } catch (error) {}
        };
        eventSource.onerror = function () {
          setConnectionState("connecting");
        };
      }
      window.addEventListener("resize", requestFitText);
      if (typeof ResizeObserver === "function" && contentLayer) {
        stageResizeObserver = new ResizeObserver(function () {
          requestFitText();
        });
        stageResizeObserver.observe(contentLayer);
      }

      applyMediaSignal(DEFAULT_MEDIA_SIGNAL);
      fetchLatestMedia().finally(function () {
        connectStream();
      });
      })();
    </script>
