<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ROSA Retail</title>
  <style>
    :root {
      color-scheme: light;
      --bg:#f5f6f7; --panel:#fff; --ink:#17212b; --muted:#667581; --line:#dfe4e8;
      --green:#16734a; --green-soft:#e7f4ed; --red:#b42318; --amber:#a45d09;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);letter-spacing:0}
    button,input,textarea,select{font:inherit;letter-spacing:0} button{cursor:pointer} button:disabled{cursor:not-allowed;opacity:.55}
    [hidden]{display:none!important}.shop{width:min(1180px,100%);margin:0 auto;padding:0 18px 110px}
    .topbar{position:sticky;top:0;z-index:8;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;min-height:68px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.97);margin:0 -18px;padding:10px 18px}
    .brand{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center}.brand-mark{width:40px;height:40px;display:grid;place-items:center;border-radius:8px;background:var(--green);color:#fff;font-size:13px;font-weight:900}
    .brand h1,.brand p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.brand h1{margin:0;font-size:16px}.brand p{margin:3px 0 0;color:var(--muted);font-size:10px}
    .top-actions{display:flex;align-items:center;gap:8px}.secure{display:inline-flex;align-items:center;gap:6px;min-height:31px;border:1px solid #b9d9c8;border-radius:6px;background:var(--green-soft);color:var(--green);padding:0 9px;font-size:10px;font-weight:850}.secure::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
    .icon{width:36px;height:36px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font-size:18px;font-weight:750}
    .shop-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.55fr);gap:24px;align-items:end;padding:28px 0 18px}
    .shop-head h2{margin:0;font-size:clamp(26px,4vw,40px);line-height:1.08}.shop-head p{margin:9px 0 0;max-width:640px;color:var(--muted);font-size:13px;line-height:1.55}
    .store-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}.metric{padding:13px;border-right:1px solid var(--line)}.metric:last-child{border:0}.metric span,.metric strong{display:block}.metric span{color:var(--muted);font-size:9px;text-transform:uppercase;font-weight:850}.metric strong{margin-top:6px;font-size:15px}
    .tools{display:flex;gap:8px;align-items:center;margin:0 0 13px}.search{flex:1;min-height:40px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:0 12px;outline:none}.search:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(22,115,74,.11)}
    .categories{display:flex;gap:7px;overflow:auto;margin:0 0 16px;padding-bottom:3px;scrollbar-width:none}.categories::-webkit-scrollbar{display:none}.category{flex:0 0 auto;min-height:34px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:0 12px;color:var(--muted);font-size:11px;font-weight:800}.category[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft);color:var(--green)}
    .catalog{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.product{min-width:0;border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden;box-shadow:0 4px 14px rgba(23,33,43,.04)}
    .media{position:relative;aspect-ratio:4/3;background:#e9eef1;overflow:hidden}.media img{width:100%;height:100%;display:block;object-fit:cover}.media-fallback{position:absolute;inset:0;display:grid;place-items:center;color:#7c8994;font-size:22px;font-weight:900}.media img+.media-fallback{display:none}.stock{position:absolute;left:8px;top:8px;min-height:23px;display:inline-flex;align-items:center;border-radius:5px;background:rgba(255,255,255,.93);padding:0 7px;color:var(--green);font-size:9px;font-weight:900}.stock[data-tone="low"]{color:var(--amber)}.stock[data-tone="out"]{color:var(--red)}
    .product-body{padding:12px}.product-cat{color:var(--muted);font-size:9px;font-weight:800;text-transform:uppercase}.product h3{height:38px;margin:6px 0 3px;font-size:14px;line-height:1.35;overflow:hidden}.product-desc{height:34px;margin:0;color:var(--muted);font-size:10px;line-height:1.45;overflow:hidden}.product-foot{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-top:12px}.price{font-size:15px;font-weight:900;color:var(--green)}
    .add{width:34px;height:34px;border:0;border-radius:6px;background:#172735;color:#fff;font-size:19px;line-height:1}.add:disabled{background:#a8b1b8}
    .cart-bar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px max(14px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:rgba(255,255,255,.97);border-top:1px solid var(--line)}
    .cart-inner{width:min(1144px,100%);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.cart-summary span,.cart-summary strong{display:block}.cart-summary span{color:var(--muted);font-size:10px}.cart-summary strong{margin-top:2px;font-size:16px}.checkout{min-height:44px;border:0;border-radius:7px;background:var(--green);color:#fff;padding:0 18px;font-size:12px;font-weight:900}
    .sheet{position:fixed;inset:0;z-index:20;display:grid;align-items:end;background:rgba(15,24,31,.48);padding:18px}.sheet-card{width:min(640px,100%);max-height:min(780px,calc(100vh - 36px));overflow:auto;margin:0 auto;border-radius:8px;background:#fff;box-shadow:0 24px 60px rgba(0,0,0,.25)}
    .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:14px 16px}.sheet-head h2{margin:0;font-size:17px}.sheet-body{padding:15px}.cart-lines{display:grid}.cart-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;border-bottom:1px solid #edf0f2;padding:10px 0}.cart-line strong,.cart-line span{display:block}.cart-line strong{font-size:12px}.cart-line span{margin-top:3px;color:var(--muted);font-size:10px}.qty{display:flex;align-items:center;gap:7px}.qty button{width:29px;height:29px;border:1px solid var(--line);border-radius:5px;background:#fff}.qty b{min-width:24px;text-align:center;font-size:12px}
    .form{display:grid;gap:10px;margin-top:14px}.form label{display:grid;gap:5px;color:var(--muted);font-size:10px;font-weight:800}.input{width:100%;min-height:39px;border:1px solid var(--line);border-radius:6px;padding:0 10px}.form textarea{min-height:68px;padding-top:9px;resize:vertical}.total{display:flex;align-items:center;justify-content:space-between;margin-top:14px;border-top:1px solid var(--line);padding-top:13px}.total span{font-size:12px}.total strong{font-size:20px;color:var(--green)}
    .sheet-actions{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;border-top:1px solid var(--line);padding:12px 16px}.secondary,.primary{min-height:43px;border-radius:6px;font-size:12px;font-weight:900}.secondary{border:1px solid var(--line);background:#fff}.primary{border:0;background:var(--green);color:#fff}
    .empty{grid-column:1/-1;border:1px dashed #c9d1d7;border-radius:8px;background:#fff;color:var(--muted);padding:32px 18px;text-align:center;font-size:12px}.toast{position:fixed;left:16px;right:16px;bottom:82px;z-index:30;width:min(440px,calc(100% - 32px));margin:0 auto;border-radius:7px;background:#172735;color:#fff;padding:12px 14px;box-shadow:0 12px 36px rgba(0,0,0,.2);font-size:11px;line-height:1.45}.toast[data-tone="error"]{background:#8f281f}
    @media(max-width:900px){.catalog{grid-template-columns:repeat(3,minmax(0,1fr))}.shop-head{grid-template-columns:1fr}}
    @media(max-width:620px){.shop{padding:0 11px 105px}.topbar{margin:0 -11px;padding:9px 11px}.secure{display:none}.shop-head{padding:19px 0 14px}.shop-head h2{font-size:27px}.shop-head p{font-size:11px}.catalog{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.product-body{padding:10px}.product h3{height:36px;font-size:13px}.product-desc{display:none}.price{font-size:13px}.media{aspect-ratio:1/1}.sheet{padding:0}.sheet-card{max-height:92vh;border-radius:8px 8px 0 0}.store-summary{max-width:340px}.metric{padding:10px}.tools{position:sticky;top:68px;z-index:7;background:var(--bg);padding:8px 0;margin-bottom:6px}}
    @media(max-width:360px){.catalog{gap:7px}.product h3{font-size:12px}.product-foot{gap:5px}.add{width:31px;height:31px}.price{font-size:12px}}
  </style>
</head>
<body>
  <main class="shop">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">RC</div><div><h1 id="store-title">ROSA Retail</h1><p id="store-address">Đang tải cửa hàng</p></div></div>
      <div class="top-actions"><span class="secure">Đã xác thực</span><button class="icon" id="refresh" type="button" aria-label="Tải lại" title="Tải lại">↻</button></div>
    </header>
    <section class="shop-head">
      <div><h2 id="page-title">Mua nhanh, nhận thuận tiện.</h2><p id="page-subtitle">Danh mục sản phẩm được cập nhật trực tiếp từ cửa hàng.</p></div>
      <div class="store-summary"><div class="metric"><span>Sản phẩm</span><strong id="product-count">0</strong></div><div class="metric"><span>Tình trạng</span><strong id="store-status">Đang tải</strong></div></div>
    </section>
    <div class="tools"><input class="search" id="search" type="search" placeholder="Tìm sản phẩm" autocomplete="off"></div>
    <nav class="categories" id="categories" aria-label="Nhóm sản phẩm"></nav>
    <section class="catalog" id="catalog" aria-live="polite"><div class="empty">Đang tải sản phẩm…</div></section>
  </main>
  <div class="cart-bar"><div class="cart-inner"><div class="cart-summary"><span id="cart-label">Chưa có sản phẩm</span><strong id="cart-total">0đ</strong></div><button class="checkout" id="checkout" type="button" disabled>Xem đơn hàng</button></div></div>
  <div class="sheet" id="sheet" hidden><form class="sheet-card" id="order-form"><div class="sheet-head"><h2>Xác nhận đơn hàng</h2><button class="icon" id="sheet-close" type="button" aria-label="Đóng">×</button></div><div class="sheet-body"><div class="cart-lines" id="cart-lines"></div><div class="form"><label>Phương thức thanh toán<select class="input" id="payment"><option value="cod">Thanh toán khi nhận hàng</option><option value="cash">Tiền mặt tại máy/quầy</option></select></label><label>Ghi chú<textarea class="input" id="note" maxlength="240" placeholder="Yêu cầu cho đơn hàng"></textarea></label></div><div class="total"><span>Tổng thanh toán</span><strong id="sheet-total">0đ</strong></div></div><div class="sheet-actions"><button class="secondary" id="sheet-cancel" type="button">Tiếp tục mua</button><button class="primary" id="submit-order" type="submit">Xác nhận đặt hàng</button></div></form></div>
  <div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
  <script>
    (function(){"use strict";
      var ids=pageIds(), state={link:{},products:[],categories:[],cart:{},category:"",search:"",busy:false};
      var n={storeTitle:byId("store-title"),storeAddress:byId("store-address"),pageTitle:byId("page-title"),pageSubtitle:byId("page-subtitle"),productCount:byId("product-count"),storeStatus:byId("store-status"),search:byId("search"),categories:byId("categories"),catalog:byId("catalog"),cartLabel:byId("cart-label"),cartTotal:byId("cart-total"),checkout:byId("checkout"),refresh:byId("refresh"),sheet:byId("sheet"),sheetClose:byId("sheet-close"),sheetCancel:byId("sheet-cancel"),cartLines:byId("cart-lines"),sheetTotal:byId("sheet-total"),form:byId("order-form"),submit:byId("submit-order"),payment:byId("payment"),note:byId("note"),toast:byId("toast")};
      function byId(id){return document.getElementById(id)}
      function pageIds(){var p=location.pathname.split("/").filter(Boolean),i=p.indexOf("iot-page");return{ioid:decodeURIComponent(p[i+1]||""),pageid:decodeURIComponent(p[i+2]||"")}}
      function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
      function num(v){var x=Number(v);return Number.isFinite(x)?x:0} function money(v){return num(v).toLocaleString("vi-VN",{maximumFractionDigits:0})+"đ"}
      function image(v){var s=String(v||"").trim();return /^https?:\/\//i.test(s)?s:""}
      function post(macro,params){return fetch("/api/iot-page-macro/"+encodeURIComponent(ids.ioid)+"/"+encodeURIComponent(ids.pageid),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({macro:macro,params:params||{}})}).then(function(r){return r.json().catch(function(){return null}).then(function(d){if(!r.ok||!d||d.ok===false)throw new Error(d&&(d.message||d.error)||"Không thể tải dữ liệu.");return Array.isArray(d.rows)?d.rows:[]})})}
      function load(){n.storeStatus.textContent="Đang tải";return post("retail-link-state",{}).then(function(rows){state.link=rows.filter(function(r){return r.row_type==="link"})[0]||{};state.products=rows.filter(function(r){return r.row_type==="product"});state.categories=rows.filter(function(r){return r.row_type==="category"});render()}).catch(function(e){n.storeStatus.textContent="Gián đoạn";n.catalog.innerHTML='<div class="empty">'+esc(e.message||"Không thể tải cửa hàng")+'</div>';toast(e.message||"Không thể tải cửa hàng","error")})}
      function render(){n.storeTitle.textContent=state.link.store_name||"ROSA Retail";n.storeAddress.textContent=state.link.store_address||"";n.pageTitle.textContent=state.link.label||"Mua nhanh, nhận thuận tiện.";n.pageSubtitle.textContent=state.link.subtitle||"Danh mục sản phẩm được cập nhật trực tiếp từ cửa hàng.";n.productCount.textContent=String(state.products.length);n.storeStatus.textContent=state.link.status==="enabled"?"Đang mở":"Tạm đóng";renderCategories();renderProducts();renderCart()}
      function renderCategories(){var cats=[{id:"",label:"Tất cả"}].concat(state.categories);n.categories.innerHTML=cats.map(function(c){return'<button class="category" type="button" data-category="'+esc(c.id)+'" aria-pressed="'+(state.category===c.id?'true':'false')+'">'+esc(c.label)+'</button>'}).join("")}
      function filtered(){var q=state.search.toLowerCase();return state.products.filter(function(p){return(!state.category||p.category_id===state.category)&&(!q||(p.label+" "+p.subtitle).toLowerCase().indexOf(q)>=0)})}
      function renderProducts(){var rows=filtered();if(!rows.length){n.catalog.innerHTML='<div class="empty">Không tìm thấy sản phẩm phù hợp.</div>';return}n.catalog.innerHTML=rows.map(function(p){var src=image(p.image_url),stock=num(p.stock),tone=stock<=0?"out":stock<=3?"low":"ok",initial=String(p.label||"SP").slice(0,2).toUpperCase();return'<article class="product"><div class="media">'+(src?'<img src="'+esc(src)+'" alt="'+esc(p.label)+'" loading="lazy" onerror="this.remove()">':'')+'<span class="media-fallback">'+esc(initial)+'</span><span class="stock" data-tone="'+tone+'">'+(stock>0?'Còn '+stock:'Hết hàng')+'</span></div><div class="product-body"><span class="product-cat">'+esc(p.category_name||"")+'</span><h3>'+esc(p.label)+'</h3><p class="product-desc">'+esc(p.subtitle||"")+'</p><div class="product-foot"><strong class="price">'+money(p.price)+'</strong><button class="add" type="button" aria-label="Thêm '+esc(p.label)+'" data-add="'+esc(p.id)+'"'+(stock<=0?' disabled':'')+'>+</button></div></div></article>'}).join("")}
      function cartRows(){return Object.keys(state.cart).map(function(id){var p=state.products.filter(function(x){return x.id===id})[0];return p?{p:p,qty:state.cart[id]}:null}).filter(Boolean)}
      function total(){return cartRows().reduce(function(sum,x){return sum+num(x.p.price)*x.qty},0)}
      function renderCart(){var rows=cartRows(),count=rows.reduce(function(s,x){return s+x.qty},0);n.cartLabel.textContent=count?count+" sản phẩm":"Chưa có sản phẩm";n.cartTotal.textContent=money(total());n.checkout.disabled=!count;n.sheetTotal.textContent=money(total());n.cartLines.innerHTML=rows.map(function(x){return'<div class="cart-line"><div><strong>'+esc(x.p.label)+'</strong><span>'+money(x.p.price)+' · còn '+num(x.p.stock)+'</span></div><div class="qty"><button type="button" data-dec="'+esc(x.p.id)+'" aria-label="Giảm">−</button><b>'+x.qty+'</b><button type="button" data-inc="'+esc(x.p.id)+'" aria-label="Tăng">+</button></div></div>'}).join("")}
      function change(id,delta){var p=state.products.filter(function(x){return x.id===id})[0];if(!p)return;var next=Math.max(0,Math.min(num(p.stock),num(state.cart[id])+delta));if(next)state.cart[id]=next;else delete state.cart[id];renderCart()}
      function openSheet(){if(!cartRows().length)return;renderCart();n.sheet.hidden=false} function closeSheet(){n.sheet.hidden=true}
      function submit(e){e.preventDefault();if(state.busy)return;var payload=cartRows().map(function(x){return{product_id:x.p.id,qty:x.qty}}),rid="WEB-"+Date.now()+"-"+Math.random().toString(16).slice(2,8);state.busy=true;n.submit.disabled=true;post("retail-link-create-order",{cart_json:JSON.stringify(payload),client_request_id:rid,payment_method:n.payment.value,note:n.note.value.trim()}).then(function(rows){var r=rows[0]||{};if(String(r.c1||r.code).toUpperCase()!=="OK")throw new Error(r.message||r.code||"Không thể tạo đơn.");state.cart={};closeSheet();renderCart();toast("Đơn "+(r.order_code||"")+" đã được tiếp nhận.","ok");return load()}).catch(function(err){toast(err.message||"Không thể tạo đơn.","error")}).finally(function(){state.busy=false;n.submit.disabled=false})}
      function toast(msg,tone){n.toast.textContent=msg;n.toast.dataset.tone=tone||"ok";n.toast.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(function(){n.toast.hidden=true},4200)}
      n.categories.addEventListener("click",function(e){var b=e.target.closest("[data-category]");if(!b)return;state.category=b.dataset.category;renderCategories();renderProducts()});n.catalog.addEventListener("click",function(e){var b=e.target.closest("[data-add]");if(b)change(b.dataset.add,1)});n.search.addEventListener("input",function(){state.search=n.search.value.trim();renderProducts()});n.checkout.addEventListener("click",openSheet);n.sheetClose.addEventListener("click",closeSheet);n.sheetCancel.addEventListener("click",closeSheet);n.sheet.addEventListener("click",function(e){if(e.target===n.sheet)closeSheet()});n.cartLines.addEventListener("click",function(e){var i=e.target.closest("[data-inc]"),d=e.target.closest("[data-dec]");if(i)change(i.dataset.inc,1);if(d)change(d.dataset.dec,-1)});n.refresh.addEventListener("click",load);n.form.addEventListener("submit",submit);document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet()});load();
    })();
  </script>
</body>
</html>
