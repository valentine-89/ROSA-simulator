<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cài đặt kho lạnh</title><link rel="stylesheet" href="/sample_dashboards/setup_shared.css?v=2026.05.30.1"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f8fafc;color:#0f172a}body{font-family:Segoe UI,Arial,sans-serif;padding:16px}.shell{display:grid;gap:14px;max-width:1100px;margin:auto}.head,.panel,.item-card{border:1px solid #e2e8f0;background:#fff;border-radius:18px;padding:16px}.head,.toolbar,.item-top{display:flex;align-items:center;justify-content:space-between;gap:10px}h1,h2,h3{margin:0}.status{color:#64748b;font-size:13px;margin-top:5px}.badge{padding:6px 10px;border-radius:99px;background:#e0f2fe;color:#0369a1;font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.full{grid-column:1/-1}label{display:grid;gap:5px;color:#475569;font-size:12px;font-weight:700}input,select{width:100%;min-height:40px;padding:8px 10px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:#0f172a}.item-list,.advanced{display:grid;gap:12px;margin-top:12px}.advanced{padding-top:12px;border-top:1px solid #e2e8f0}button{border:0;border-radius:10px;padding:9px 12px;background:#0284c7;color:#fff;font-weight:800;cursor:pointer}.secondary{background:#e2e8f0;color:#334155}.danger{background:#fee2e2;color:#b91c1c}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.item-top{align-items:flex-start;flex-direction:column}}</style></head><body><script src="./setup_bridge_compat.js?v=2026.07.14.1"></script><script src="./setup_cold_storage_vi.js?v=2026.07.14.1"></script></body></html>
